name: Release skill zips

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zips
        run: |
          mkdir dist
          # Skill folder at the zip root: claude.ai, ChatGPT
          (cd skills && zip -r ../dist/openalex-academic-discovery.zip openalex-academic-discovery -x '*/__pycache__/*')
          # SKILL.md at the zip root: Perplexity
          (cd skills/openalex-academic-discovery && zip -r ../../dist/openalex-academic-discovery-flat.zip . -x '*/__pycache__/*')
          unzip -l dist/openalex-academic-discovery.zip
          unzip -l dist/openalex-academic-discovery-flat.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Prepackaged skill for web apps. Use openalex-academic-discovery.zip for claude.ai and ChatGPT, and openalex-academic-discovery-flat.zip for Perplexity. See the README for install steps."
